<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Attendance Kiosk — Barangay Talisay</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="kiosk">
  <div id="keyBanner" class="banner hidden">Supabase key not set. Open <b>js/config.js</b> and paste your publishable key.</div>

  <!-- Kiosk login (done once per device; the session is remembered) -->
  <section id="loginView" class="login hidden" style="color:var(--ink)">
    <h1>Attendance Kiosk</h1>
    <p>Sign in with the kiosk account to start this device.</p>
    <form id="loginForm">
      <label>Email</label><input id="email" type="email" required autocomplete="username" />
      <label>Password</label><input id="password" type="password" required autocomplete="current-password" />
      <button class="btn primary" type="submit">Start kiosk</button>
      <div id="loginError" class="error"></div>
    </form>
  </section>

  <section id="kioskView" class="kiosk-wrap hidden">
    <header class="kiosk-head">
      <div class="clock" id="clock">--:--</div>
      <div class="date" id="date"></div>
    </header>

    <div style="display:grid;place-items:center;gap:1.25rem">
      <div class="cam" id="cam">
        <video id="video" muted playsinline></video>
        <canvas id="overlay"></canvas>
      </div>
      <div class="status" id="status">Starting camera…</div>
    </div>

    <footer class="kiosk-foot">
      <span id="info"></span>
      <span><a href="admin.html" style="color:#64748b">Admin</a> · <button id="logoutBtn">Sign out kiosk</button></span>
    </footer>
  </section>

  <div id="result" class="result hidden">
    <div class="card">
      <span class="tag" id="rTag">TIME IN</span>
      <div class="name" id="rName"></div>
      <div class="time" id="rTime"></div>
      <div id="rMsg" style="color:var(--muted);margin-top:.5rem"></div>
    </div>
  </div>

  <script type="module" src="js/kiosk.js"></script>
</body>
</html>
